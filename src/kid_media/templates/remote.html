<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KidMedia Remote</title>
<style>
  :root { --bg:#0d0d0d; --card:#1c1c1e; --accent:#ff6b35; --text:#f0f0f0; --muted:#888; --green:#34c759; --border:#2a2a2a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
         min-height:100dvh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:1.5rem; padding:1.5rem; }

  /* Now playing */
  .now-playing { text-align:center; max-width:320px; width:100%; }
  .cover { width:180px; height:180px; border-radius:1rem; object-fit:cover;
           background:var(--card); margin:0 auto 1rem; display:block;
           border:1px solid var(--border); }
  .track-title  { font-size:1.15rem; font-weight:700; margin-bottom:.3rem; line-height:1.3; }
  .track-artist { font-size:.9rem; color:var(--muted); }
  .status-dot   { display:inline-block; width:8px; height:8px; border-radius:50%;
                   background:var(--muted); margin-right:.4rem; transition:background .3s; }
  .status-dot.playing { background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .status-label { font-size:.75rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }

  /* Progress */
  .progress-row { width:100%; max-width:320px; display:flex; align-items:center; gap:.6rem; }
  .time-label  { font-size:.72rem; color:var(--muted); min-width:36px; }
  .time-label.right { text-align:right; }
  .progress-bar { flex:1; height:4px; background:var(--border); border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); border-radius:999px; width:0%; transition:width .5s linear; }

  /* Controls */
  .controls { display:flex; align-items:center; justify-content:center; gap:1.5rem; width:100%; max-width:320px; }
  .ctrl-btn { background:var(--card); border:1px solid var(--border); border-radius:50%;
              color:var(--text); font-size:1.6rem; cursor:pointer;
              transition:transform .1s, background .15s, border-color .15s;
              display:flex; align-items:center; justify-content:center;
              -webkit-user-select:none; user-select:none; }
  .ctrl-btn:active { transform:scale(.88); }
  .ctrl-btn.sm { width:60px; height:60px; }
  .ctrl-btn.lg { width:80px; height:80px; font-size:2rem; background:var(--accent);
                 border-color:var(--accent); color:#fff; }
  .ctrl-btn:hover { border-color:var(--accent); }

  /* Stop button */
  .stop-row { margin-top:.5rem; }
  .stop-btn { background:transparent; border:1px solid var(--border); border-radius:2rem;
              color:var(--muted); font-size:.8rem; padding:.45rem 1.2rem; cursor:pointer;
              transition:all .15s; }
  .stop-btn:active { opacity:.6; }
  .stop-btn:hover  { border-color:#ff453a; color:#ff453a; }

  /* Error / idle */
  .idle-msg { font-size:.85rem; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<div class="now-playing" id="nowPlaying">
  <img class="cover" id="coverImg" src="" alt="Cover art">
  <div class="track-title"  id="trackTitle">Not playing</div>
  <div class="track-artist" id="trackArtist">—</div>
  <br>
  <span class="status-dot" id="statusDot"></span>
  <span class="status-label" id="statusLabel">Idle</span>
</div>

<div class="progress-row">
  <span class="time-label" id="timeElapsed">0:00</span>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="time-label right" id="timeDuration">0:00</span>
</div>

<div class="controls">
  <button class="ctrl-btn sm" onclick="cmd('prev')"   title="Previous">⏮</button>
  <button class="ctrl-btn lg" id="playPauseBtn" onclick="cmd('toggle')" title="Play / Pause">▶</button>
  <button class="ctrl-btn sm" onclick="cmd('next')"   title="Next">⏭</button>
</div>

<div class="stop-row">
  <button class="stop-btn" onclick="cmd('stop')">⏹ Stop &amp; Clear</button>
</div>

<p class="idle-msg" id="idleMsg"></p>

<script>
const BASE = window.location.origin;
let lastState = {};

function fmt(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

async function cmd(action) {
  try {
    await fetch(`${BASE}/api/player/command`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({command: action})
    });
  } catch(e) { console.warn('cmd error', e); }
}

async function poll() {
  try {
    const r = await fetch(`${BASE}/api/player/state`);
    const s = await r.json();

    const playing = !!s.playing;
    document.getElementById('playPauseBtn').textContent = playing ? '⏸' : '▶';
    document.getElementById('statusDot').className = 'status-dot' + (playing ? ' playing' : '');
    document.getElementById('statusLabel').textContent = playing ? 'Playing' : s.title ? 'Paused' : 'Idle';
    document.getElementById('trackTitle').textContent  = s.title  || 'Not playing';
    document.getElementById('trackArtist').textContent = s.artist || (s.title ? '' : '—');

    const cover = document.getElementById('coverImg');
    if (s.cover_art && s.cover_art !== lastState.cover_art) cover.src = s.cover_art;
    if (!s.cover_art) cover.src = '';

    const pos = s.position || 0, dur = s.duration || 0;
    document.getElementById('timeElapsed').textContent = fmt(pos);
    document.getElementById('timeDuration').textContent = fmt(dur);
    document.getElementById('progressFill').style.width = dur ? `${Math.min(pos/dur*100,100)}%` : '0%';

    document.getElementById('idleMsg').textContent = (!s.title && !playing) ? 'Open KidMedia on the playback device to start.' : '';
    lastState = s;
  } catch(e) {
    document.getElementById('idleMsg').textContent = 'Cannot reach KidMedia.';
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
