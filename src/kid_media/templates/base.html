<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}{{ title }} - KidMedia{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
    <script>window.KIDMEDIA_PIN = {{ parent_pin | tojson }};</script>
    <!-- Loaded in <head>, before any page script: album/show pages read the lock
         state at parse time, and the media bridge installs window.__mediaControl
         which the native shell may call as soon as the page appears. -->
    <script src="/static/js/kidmedia-lock.js"></script>
    <script src="/static/js/kidmedia-media.js"></script>
    <style>
        /* Additional zoom prevention */
        * {
            touch-action: pan-y pan-x;
        }

        /* Prevent double-tap zoom on specific elements */
        a, button, .album-card, .track-item, .player-button, .back-button {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="app-title">🎵 KidMedia</h1>
            {% block header_nav %}{% endblock %}
        </header>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_js %}{% endblock %}

    <script>
        // Prevent pinch zoom on iOS and other touch devices
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });

        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
